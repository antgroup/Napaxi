id: chat_switch_engine
suite: L1
title: 切换引擎——打开 engine 选择器、切到非默认项、确认 composer 仍在、可输入
timeout: 180
# TODO: 步骤语义待附稿 §11 原文校准；引擎项用 dk.engine.popup.item.<engine.id> 模板键
# （运行时 engine.id 由 keys.yaml 模板化，devpool 真机校准）。
steps:
  - launch: { pkg: com.napa.app.test }
  - tap: { selector: { text: ["稍后", "Later"] }, timeout: 3, optional: true }
  - assert_visible: { selector: { text: ["Napaxi"] }, timeout: 30 }
  - tap: { selector: { key: chat_engine_entry } }
  - assert_visible: { selector: { text: ["Codex(beta)"] }, timeout: 10 }
  # 切到列表中第一个非默认引擎；具体 engine.id 在 devpool 真机校准，schema 留 TODO。
  - tap: { selector: { description: "dk.engine.popup.item.codex" }, timeout: 10 }
  - back: {}
  - assert_visible: { selector: { key: chat_composer }, timeout: 15 }
  - tap: { selector: { key: chat_composer } }
  - set_text: { selector: { key: chat_composer }, text: "SWITCH_ENGINE_OK_{RUN_ID}" }
  - assert_visible: { selector: { text: ["SWITCH_ENGINE_OK_{RUN_ID}"] }, timeout: 10 }
