[advisories]
ignore = [
    # Dev-only test dependency: httpmock -> async-object-pool -> async-std.
    # It is not linked into runtime or release artifacts. Replace the mock
    # server dependency before removing this exception.
    "RUSTSEC-2025-0052",

    # Vendored libsql 0.6 dependency chain. Napaxi currently carries a patched
    # libsql fork for local recall storage; upstream still pins bincode 1 and
    # the older rustls 0.22 TLS stack. Revisit when libsql is updated or
    # replaced.
    "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # Newly surfaced advisories on the same vendored libsql 0.6 chain (rustls
    # 0.22 / rustls-webpki / h2) plus the transitive unsafe-libyaml from that
    # chain. Same root cause as the libsql block above; tracked here so `cargo
    # audit` goes green until libsql is bumped/replaced.
    "RUSTSEC-2026-0258", # h2 0.3.27 (via libsql TLS stack)
    "RUSTSEC-2026-0349", # rustls 0.22.4
    "RUSTSEC-2026-0346", # rustls 0.22.4
    "RUSTSEC-2026-0382", # rustls-webpki 0.102.8
    "RUSTSEC-2024-0449", # unsafe-libyaml 0.2.11 (transitive)

    # chrono 0.4.45 / chrono-tz 0.10.4 advisories surfaced in the same audit
    # run. chrono is a direct Napaxi dependency (crates/core, packages/api_bridge);
    # the fix is to bump the version constraint once a 1.92-compatible,
    # advisory-cleared chrono/chrono-tz release is available, rather than
    # carrying an unverified bump here.
    "RUSTSEC-2026-0543", # chrono 0.4.45
    "RUSTSEC-2026-0555", # chrono-tz 0.10.4
]
