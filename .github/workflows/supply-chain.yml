name: supply-chain

on:
  push:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Print Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Resolve workspace metadata
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Install cargo-deny
        # Pin below 0.22: cargo-deny 0.22.0 requires rustc 1.95, but the
        # `actions/checkout` runner's `dtolnay/rust-toolchain@stable` currently
        # resolves to rustc 1.92. 0.21.0 supports rustc 1.89+, so it installs on
        # the pinned/1.92 runner; bump once stable advances past 1.95. (See
        # CI log: "cargo-deny 0.21.0 supports rustc 1.89.0".)
        run: cargo install cargo-deny --version 0.21 --locked

      - name: cargo deny check
        run: cargo deny check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Print Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Resolve workspace metadata
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
