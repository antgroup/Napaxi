name: rust

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `@stable` is the action's own stable branch (latest action release),
      # not a Rust version. With no `toolchain:` input it installs the channel
      # pinned by the repo-root `rust-toolchain.toml` (channel = "1.92").
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Print Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Resolve workspace metadata
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Print Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Resolve workspace metadata
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      # Generated rustdoc is the published API reference. Treat any rustdoc
      # diagnostic — broken intra-doc links, ambiguous paths, undocumented
      # public items flagged by `missing_docs` — as a build failure so doc rot
      # cannot accumulate silently between releases.
      - name: cargo doc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace
