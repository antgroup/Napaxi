name: flutter

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/flutter/**'
      - 'examples/flutter/**'
      - 'packages/api_bridge/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'packages/flutter/**'
      - 'examples/flutter/**'
      - 'packages/api_bridge/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      # Fail fast with a clear cause if the Flutter/Dart install or pub
      # resolution is broken before analyze/test run.
      - name: Print Flutter / Dart version
        run: |
          flutter --version
          dart --version
      - name: Resolve Flutter dependencies (packages/flutter)
        working-directory: packages/flutter
        run: flutter pub get

      - name: flutter analyze (packages/flutter)
        working-directory: packages/flutter
        run: flutter analyze --no-fatal-infos

      - name: flutter test (packages/flutter)
        working-directory: packages/flutter
        run: flutter test

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      # Fail fast with a clear cause if the Flutter/Dart install or pub
      # resolution is broken before analyze/test run. examples/flutter's
      # pubspec.lock pins video_player 2.14.0 which requires Dart >= 3.12;
      # the demo job is what the workitem flags as failing on Dart 3.11.5.
      - name: Print Flutter / Dart version
        run: |
          flutter --version
          dart --version
      - name: Resolve Flutter dependencies (examples/flutter)
        working-directory: examples/flutter
        run: flutter pub get

      # Android Kotlin compile gate (DIMA 2026111700120700056).
      # The Flutter plugin's Kotlin sources (packages/flutter/android/src/main/kotlin)
      # are compiled by :napaxi_flutter:compileDebugKotlin, reachable via the
      # example app's gradle build (dev.flutter.flutter-plugin-loader includes
      # packages/flutter/android as the :napaxi_flutter library module). flutter pub
      # get above generated examples/flutter/android/gradlew (gitignored at runtime).
      # excludes verifySdkNativeInputs/buildRust/verifySdkNativeOutputs so the gate
      # stays a pure Kotlin type-check and does not require the NDK/cargo .so build
      # (that pipeline lives in .github/workflows/native.yml); preBuild is not a
      # dependency of compileDebugKotlin under AGP, and -x guards against variance.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: napaxi_flutter compileDebugKotlin gate (examples/flutter)
        working-directory: examples/flutter/android
        run: ./gradlew :napaxi_flutter:compileDebugKotlin --no-daemon -x verifySdkNativeInputs -x buildRust -x verifySdkNativeOutputs

      - name: flutter analyze (examples/flutter)
        working-directory: examples/flutter
        run: flutter analyze --no-fatal-infos

      - name: flutter test (examples/flutter)
        working-directory: examples/flutter
        run: flutter test
