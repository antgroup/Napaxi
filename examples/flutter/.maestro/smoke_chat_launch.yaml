# Maestro smoke: launch the app and navigate the engine-selector popup.
#
# Selectors are text-based (Flutter does not expose widget Keys to the
# accessibility tree). Two constraints shaped this flow:
#   * `contains:` / legacy selector maps are not understood by every installed
#     maestro build -> plain regex strings only. maestro matches `text` with a
#     full-string regex, hence the `[\s\S]*` wrappers around newline-bearing
#     accessibility labels such as `dk.chat.engineEntry\nNapaxi`.
#   * a Flutter TextField publishes its semantics key in the `hint` attribute,
#     which maestro cannot select -> the composer typing steps live in the u2
#     cases (L0 smoke / L1) instead of here.
appId: com.napa.app.test
---
- launchApp:
    clearState: true
# Dismiss the in-app update dialog if the demo build happens to be
# configured with Pgyer credentials and a newer build exists.
- tapOn:
    text: "稍后"
    optional: true
- extendedWaitUntil:
    visible: '[\s\S]*Napaxi[\s\S]*'
    timeout: 30000
- assertVisible: '[\s\S]*dk\.chat\.engineEntry[\s\S]*'
# Navigation coverage via the engine-selector popup: a PopupMenuButton is a
# modal route, so `back` dismisses it deterministically (the custom sessions
# drawer has no such guarantee — a back there can exit to the launcher).
- tapOn: '[\s\S]*Napaxi[\s\S]*'
- assertVisible: '[\s\S]*Codex[\s\S]*'
- back
- assertVisible: '[\s\S]*dk\.chat\.engineEntry[\s\S]*'
